[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-foambryo"
version = "0.1.0"
description = "Surface tensions and cell pressures of a 3-D segmentation, in napari: delaunay-watershed-3d and foambryo"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hervé Turlier", email = "herve.turlier@cnrs.fr" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "napari>=0.9",
  "magicgui",
  "qtpy",
  "superqt",
  "numpy>=2.0.0",
  "matplotlib>=3.8.4",
  "psutil",
  "delaunay-watershed-3d>=0.7.0",
  "foambryo[cli]>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/VirtualEmbryo/napari-foambryo"
Source = "https://github.com/VirtualEmbryo/napari-foambryo"
Issues = "https://github.com/VirtualEmbryo/napari-foambryo/issues"
Documentation = "https://github.com/VirtualEmbryo/napari-foambryo/blob/main/docs/how-it-works.md"
Changelog = "https://github.com/VirtualEmbryo/napari-foambryo/blob/main/CHANGELOG.md"
"Team website" = "https://www.turlierlab.com/"

[project.optional-dependencies]
testing = ["pytest", "pytest-qt", "dask[array]"]

[project.entry-points."napari.manifest"]
napari-foambryo = "napari_foambryo:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_foambryo = ["napari.yaml", "sample_data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "opengl: needs an OpenGL context (a real napari viewer window)",
  "dataset: needs the benchmarking dataset beside the repository",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PT017", "PT018"]
